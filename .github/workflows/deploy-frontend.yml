name: 🚀 Deploy Frontend to Azure Static Web Apps

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prd

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app for Dev
        if: github.event.inputs.environment == 'dev'
        run: npm run build:dev

      - name: Build Angular app for Prod
        if: github.event.inputs.environment == 'prd'
        run: npm run build:prod

      - name: Deploy to Static Web App
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets[format('AZURE_STATIC_WEB_APPS_API_TOKEN_{0}', fromJSON('{"dev":"DEV","prd":"PRD"}')[github.event.inputs.environment])] }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist/hello-world/browser"
          skip_app_build: true


      - name: 🎉 Deployment Success
        run: |
          echo "🚀 Successfully deployed to ${{ github.event.inputs.environment }} environment"
          echo "📱 Application URL: ${{ steps.builddeploy.outputs.static_web_app_url }}"
          echo "🔑 Used secret: AZURE_STATIC_WEB_APPS_API_TOKEN_${{ fromJSON('{"dev":"DEV","prd":"PRD"}')[github.event.inputs.environment] }}"